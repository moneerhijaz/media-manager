services:
  media-manager:
    build:
      context: .
      args:
        INSTALL_AVSYNC: "1"
    image: stateful-media-manager:local
    init: true
    environment:
      TMDB_READ_TOKEN: "${TMDB_READ_TOKEN:-}"
      OPENSUBTITLES_USERNAME: "${OPENSUBTITLES_USERNAME:-}"
      OPENSUBTITLES_API_KEY: "${OPENSUBTITLES_API_KEY:-}"
      OPENSUBTITLES_PASSWORD: "${OPENSUBTITLES_PASSWORD:-}"
      OPENSUBTITLES_TOKEN: "${OPENSUBTITLES_TOKEN:-}"
      HF_HOME: /state/models/huggingface
      MEDIA_LIBRARIES: "${MEDIA_LIBRARIES:-[]}"
      MEDIA_MANAGER_UID: "${MEDIA_MANAGER_UID:-1000}"
      MEDIA_MANAGER_GID: "${MEDIA_MANAGER_GID:-1000}"
    volumes:
      - media-manager-state:/state
    ports:
      - "${MEDIA_MANAGER_BIND:-0.0.0.0}:${MEDIA_MANAGER_PORT:-8787}:8787"
    stop_grace_period: 45s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  media-manager-state:
